[project]
name = "api"
version = "0.1.0"
description = "FastAPI, AG-UI and LangGraph backend for agent-yhzh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-langgraph[fastapi]>=0.0.42",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "copilotkit>=0.1.94",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-core>=1.4.9",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.0.4",
    "litellm>=1.92.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "psycopg[binary,pool]>=3.3.3",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
